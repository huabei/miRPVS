output_dir: total_dataset_results

# predict
data_dir: predict_dataset

batch_size: 1024
num_workers: 7

model:
  in_node_nf: 11
  hidden_nf: 128
  out_node_nf: 5
  n_layers: 3
  attention: true
  normalize: true

# passing checkpoint path is necessary for evaluation
ckpt_path:
  3a6p: ckpt/3a6p.ckpt
  4z4c: ckpt/4z4c.ckpt
  4z4d: ckpt/4z4d.ckpt
  6cbd: ckpt/6cbd.ckpt
